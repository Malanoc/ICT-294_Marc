<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Apprendre Vue.js</title>
  </head>
  <body>
    <div id="app">
      <h2>Nos produits</h2>
      <ul>
        <li v-for="product in products">{{ product }}</li>
      </ul>
    </div>
    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue
      createApp({
        data() {
          return {
            products: ["Chaussettes", "Chaussures", "T-shirt", "Pull"],
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
