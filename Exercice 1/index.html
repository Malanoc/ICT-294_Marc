<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Apprendre Vue.js</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <p>{{ message }}</p>
      <button @click="sayHello">Cliquez ici</button>
      <p>Nombre de clics : {{ clicks }}</p>
      <button @click="increment">Cliquez-moi !</button>
      <p>Ajouter un produit :</p>
      <button @click="addProduct('Chaussettes')">
        Ajouter les chaussettes
      </button>
    </div>
    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;
      createApp({
        data() {
          return {
            message: "Bonjour !",
            clicks: 0,
          };
        },
        methods: {
          sayHello() {
            alert("Bonjour et bienvenue !");
          },
          increment() {
            this.clicks++;
          },
          addProduct(name) {
            alert("Produit ajouté : " + name);
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
