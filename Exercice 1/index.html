<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Apprendre Vue.js</title>
  </head>
  <body>
    <div id="app">
      <p v-if="isAvailable">Produit disponible !</p>
      <p v-else>Produit indisponible.</p>
    </div>
    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;
      createApp({
        data() {
          return {
            isAvailable: true,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
